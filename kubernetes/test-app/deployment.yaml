apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-echo
  namespace: pandora-test
  labels:
    app.kubernetes.io/name: http-echo
    app.kubernetes.io/part-of: pandora
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: http-echo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: http-echo
        app.kubernetes.io/part-of: pandora
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
