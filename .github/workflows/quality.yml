name: ci

on:
  pull_request:
    paths:
      - ".github/workflows/quality.yml"
      - ".yamllint"
      - "Brewfile"
      - "flake.lock"
      - "flake.nix"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck

      - name: Check shell scripts
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

  nix:
    name: nix-flake-check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check flake
        run: nix flake check --no-update-lock-file

  manifests:
    name: manifests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check YAML style
        run: nix develop --command bash -c 'git ls-files -z "*.yaml" "*.yml" | xargs -0 yamllint'

      - name: Validate Kubernetes manifests
        run: |
          nix develop --command bash -c \
            'git ls-files -z "kubernetes/**/*.yaml" | xargs -0 kubeconform -strict \
              -ignore-missing-schemas -summary'

      - name: Check shell formatting
        run: nix develop --command bash -c 'git ls-files -z "*.sh" | xargs -0 shfmt -d -ci'
